services:
  db:
    image: postgres
    volumes:
      - db_psql:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hubro_db
      - POSTGRES_USER=hubro_user
      - POSTGRES_PASSWORD=hubro_password
    container_name: postgres_db
    ports:
      - "5432:5432"
    restart: always
    networks:
      app_net:
        ipv4_address: 192.168.0.2

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    # restart: always
    volumes:
      - db_pgadmin:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: root@root.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    
    networks:
      app_net:
        ipv4_address: 192.168.0.3

networks:
  app_net:
    ipam:
      driver: default
      config:
        - subnet: "192.168.0.0/24"
          gateway: 192.168.0.1
volumes:
  db_psql:
  
  db_pgadmin: