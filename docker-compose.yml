services:
  web:
    build: .
    volumes:
      - .:/home/app
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: .
          target: /home/app
    image: hubro_back_image:dev
    container_name: hubro_back_container
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
  
  db:
    image: postgres
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    container_name: postgres_db